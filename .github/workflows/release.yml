name: Build and publish release zips

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build hardened release zips
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME:-manual}"
          python3 scripts/default_release.py "Report-Generator-${TAG}"
          python3 scripts/burp_release.py "Report-Generator-Burp-${TAG}"
          sha256sum dist/*.zip > dist/SHA256SUMS.txt

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
