<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Report Generator</title><link rel="icon" href="/static/logo-red.png?v={{ asset_v }}"><link rel="stylesheet" href="/static/app.css?v={{ asset_v }}"><link rel="stylesheet" href="/static/overrides.css?v={{ asset_v }}"><link rel="stylesheet" href="/static/manager.css?v={{ asset_v }}"><link rel="stylesheet" href="/static/taste.css?v={{ asset_v }}">{% include "_theme_boot.html" %}</head>
<body><a class="skip-link" href="#report-manager">Skip to reports</a><header class="app-header">{% include "_brand.html" %}<span class="engagement-name"><span class="engagement-title">Reports</span><span class="fchip" id="draft-count" hidden></span><span class="fchip" id="app-count" hidden></span></span>{% include "_theme_toggle.html" %}</header>
