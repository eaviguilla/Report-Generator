<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VulnReport</title><link rel="stylesheet" href="/static/app.css?v={{ asset_v }}"><link rel="stylesheet" href="/static/overrides.css?v={{ asset_v }}"><link rel="stylesheet" href="/static/manager.css?v={{ asset_v }}"><link rel="stylesheet" href="/static/taste.css?v={{ asset_v }}"><script>try{document.documentElement.dataset.theme=localStorage.getItem("vr-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}catch(e){document.documentElement.dataset.theme="light"}</script></head>
<body><a class="skip-link" href="#report-manager">Skip to reports</a><header class="app-header"><a class="brand" href="/"><span class="brand-mark" aria-hidden="true">V</span>VulnReport</a><span class="engagement-name">Local reports</span><button id="theme-toggle" class="theme-toggle" type="button" title="Switch theme"><svg class="theme-icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg><svg class="theme-icon-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button></header>
<main id="report-manager"><div class="manager-heading"><div><h1>Reports</h1><p>Local vulnerability-report drafts.</p></div><div class="manager-actions"><input id="import-report" type="file" accept="application/zip,application/json,.zip,.json" hidden><button id="import-command" class="icon-command" type="button" title="Import report"><span aria-hidden="true">&#8593;</span><span>Import</span></button><a class="primary" href="/new">Create report</a></div></div><div class="manager-search"><label for="app-search">Apps</label><input id="app-search" type="search" placeholder="Search application folders"></div><output id="manager-status" aria-live="polite"></output><section id="legacy-reports"></section><section class="report-list"><div id="report-rows"></div></section></main><script src="/static/diagnostics.js?v={{ asset_v }}"></script><script src="/static/manager.js?v={{ asset_v }}"></script></body></html>
