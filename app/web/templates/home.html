<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Report Generator</title><link rel="icon" href="/static/logo-red.png?v={{ asset_v }}"><link rel="stylesheet" href="/static/app.css?v={{ asset_v }}"><link rel="stylesheet" href="/static/overrides.css?v={{ asset_v }}"><link rel="stylesheet" href="/static/manager.css?v={{ asset_v }}"><link rel="stylesheet" href="/static/taste.css?v={{ asset_v }}">{% include "_theme_boot.html" %}</head>
<body><a class="skip-link" href="#report-manager">Skip to reports</a><header class="app-header">{% include "_brand.html" %}<span class="engagement-name">Local reports</span>{% include "_theme_toggle.html" %}</header>
<main id="report-manager"><div class="manager-heading"><div><h1>Reports</h1><p>Local vulnerability-report drafts.</p></div><div class="manager-actions"><input id="import-report" type="file" accept="application/zip,application/json,.zip,.json" hidden><button id="import-command" class="icon-command" type="button" title="Import report"><span aria-hidden="true">&#8593;</span><span>Import</span></button><a class="primary" href="/new">Create report</a></div></div><div class="manager-search"><label for="app-search">Apps</label><input id="app-search" type="search" placeholder="Search application folders"></div><output id="manager-status" aria-live="polite"></output><section id="legacy-reports"></section><section class="report-list"><div id="report-rows"></div></section></main><script src="/static/diagnostics.js?v={{ asset_v }}"></script><script src="/static/theme.js?v={{ asset_v }}"></script><script src="/static/dialog.js?v={{ asset_v }}"></script><script src="/static/manager.js?v={{ asset_v }}"></script></body></html>
