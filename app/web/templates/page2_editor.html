<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VulnReport | Editor</title><link rel="stylesheet" href="/static/app.css?v={{ asset_v }}"><link rel="stylesheet" href="/static/overrides.css?v={{ asset_v }}"><link rel="stylesheet" href="/static/taste.css?v={{ asset_v }}"><script>try{document.documentElement.dataset.theme=localStorage.getItem("vr-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}catch(e){document.documentElement.dataset.theme="light"}</script></head>
<body><a class="skip-link" href="#editor">Skip to content editor</a><header class="app-header"><a class="brand" href="/"><span class="brand-mark" aria-hidden="true">V</span>VulnReport</a><span class="engagement-name">Web App Penetration Test</span><button id="theme-toggle" class="theme-toggle" type="button" title="Switch theme"><svg class="theme-icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg><svg class="theme-icon-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button><div class="history-controls"><button id="undo-button" type="button" aria-label="Undo last change" title="Undo last change" disabled>&#8630;</button><button id="redo-button" type="button" aria-label="Redo last change" title="Redo last change" disabled>&#8631;</button></div><button id="save-button" type="button" disabled>Saved</button></header><nav class="stepper" aria-label="Report workflow"><button class="step complete back-link" data-href="setup" type="button"><b>1</b>Setup</button><button class="step complete back-link" data-href="findings" type="button"><b>2</b>Findings</button><span class="step active" aria-current="step"><b>3</b>Content</span></nav><main id="editor" data-report='{{ report | tojson }}' data-library='{{ library_entries | tojson }}'><div class="editor-workspace"><aside id="finding-nav"></aside><div id="finding-editor"></div><aside class="review-panel"><div class="review-heading"><span>Content review</span><b id="issue-count">Review</b></div><div id="editor-notifications"></div><p class="review-note">Resolve the listed items to complete the draft.</p></aside></div><footer class="workflow-footer"><button class="back-link" data-href="findings" type="button">Previous: Findings</button><button id="generate-report" class="primary" type="button" disabled>Generate Report</button></footer></main><script src="/static/diagnostics.js?v={{ asset_v }}"></script><script src="/static/app.js?v={{ asset_v }}"></script></body></html>
