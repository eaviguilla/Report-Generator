<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VulnReport | Findings</title><link rel="stylesheet" href="/static/app.css?v={{ asset_v }}"><link rel="stylesheet" href="/static/overrides.css?v={{ asset_v }}"><link rel="stylesheet" href="/static/taste.css?v={{ asset_v }}"><script>try{document.documentElement.dataset.theme=localStorage.getItem("vr-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}catch(e){document.documentElement.dataset.theme="light"}</script></head>
<body><a class="skip-link" href="#setup">Skip to findings</a><header class="app-header"><a class="brand" href="/"><span class="brand-mark" aria-hidden="true">V</span>VulnReport</a><span class="engagement-name">Web App Penetration Test</span><button id="theme-toggle" class="theme-toggle" type="button" title="Switch theme"><svg class="theme-icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg><svg class="theme-icon-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button><div class="history-controls"><button id="undo-button" type="button" aria-label="Undo last change" title="Undo last change" disabled>&#8630;</button><button id="redo-button" type="button" aria-label="Redo last change" title="Redo last change" disabled>&#8631;</button></div><button id="save-button" type="button" disabled>Saved</button></header><nav class="stepper" aria-label="Report workflow"><button class="step complete back-link" data-href="setup" type="button"><b>1</b>Setup</button><span class="step active" aria-current="step"><b>2</b>Findings</span><span class="step" aria-disabled="true" title="Complete every finding to continue"><b>3</b>Content</span></nav>
<main id="setup" data-step="findings" data-report='{{ report | tojson }}' data-library='{{ library | tojson }}'>
<section><div class="section-title"><h1>Findings</h1><div class="finding-header-actions"><div id="library-search"><input id="search" role="combobox" aria-label="Search vulnerability library" aria-autocomplete="list" aria-controls="library-results" aria-expanded="false" autocomplete="off" placeholder="Search or select a vulnerability"><div id="library-results" role="listbox"></div></div><button id="add-finding" type="button">Add finding</button></div></div><div class="table-wrap"><table><thead><tr><th>Finding</th><th>Likelihood</th><th>Impact</th><th>Severity</th><th>Vuln ID</th><th>Status</th><th></th></tr></thead><tbody id="findings"></tbody></table><div id="findings-empty"><b>No findings yet</b><p>Search the vulnerability library above to insert a known finding, or add a blank one to write your own.</p><button id="empty-add-finding" class="subtle" type="button">Add the first finding</button></div></div></section>
<div class="finding-summary-bar"><div id="finding-summary"></div><output id="finding-validation-note" hidden></output></div><footer class="workflow-footer"><button class="back-link" data-href="setup" type="button">Previous: Setup</button><button class="primary" id="next" type="button">Next: Content</button></footer></main><script src="/static/diagnostics.js?v={{ asset_v }}"></script><script src="/static/app.js?v={{ asset_v }}"></script></body></html>
